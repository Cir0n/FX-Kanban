<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban — Nouveau tableau</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/styles/common.css(v=${#dates.createNow().time})}" rel="stylesheet">
    <link th:href="@{/styles/board-new.css(v=${#dates.createNow().time})}" rel="stylesheet">
</head>
<body class="app-page">

<!-- Barre de navigation -->
<nav class="navbar-kanban">
    <a th:href="@{/dashboard}" class="logo logo-md" style="text-decoration: none;">
        <span class="logo-k">K</span>anban
    </a>

    <div class="navbar-right">
        <button class="bell" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="bell-dot"></span>
        </button>

        <span class="avatar avatar-xl" style="background: var(--primary);"
              th:text="${userInitiales}">JD</span>
        <span class="navbar-username" th:text="${user}">jean.d</span>

        <a th:href="@{/logout}" class="navbar-logout">Déconnexion</a>
    </div>
</nav>

<!-- Contenu -->
<main class="page-container">

    <a th:href="@{/dashboard}" class="back-link">← Mes tableaux</a>

    <div class="form-card">

        <h1 class="page-title" style="text-align: center;">Nouveau tableau</h1>
        <p class="page-subtitle" style="text-align: center; margin-bottom: 28px;">
            Donnez un nom à votre tableau et choisissez une couleur.
        </p>

        <!-- Erreur globale -->
        <div th:if="${error}" class="alert-error">
            <span th:text="${error}">Une erreur est survenue.</span>
        </div>

        <form id="boardForm" th:action="@{/board/new}" method="post" novalidate>

            <div class="mb-4">
                <label for="name" class="form-label">Nom du tableau</label>
                <input type="text"
                       class="form-control"
                       th:classappend="${nameError} ? 'is-invalid'"
                       id="name"
                       name="name"
                       th:value="${name}"
                       placeholder="Ex. Refonte site vitrine"
                       maxlength="60"
                       required
                       autofocus
                       style="width: 100%;">
                <div class="invalid-feedback" th:if="${nameError}" th:text="${nameError}">
                    Ce champ est requis.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Couleur</label>
                <div class="color-picker">
                    <label th:each="c : ${couleurs}" class="color-swatch"
                           th:style="'background: ' + ${c}">
                        <input type="radio" name="couleur"
                               th:value="${c}"
                               th:checked="${c == couleur}">
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/dashboard}" class="btn-outline-kanban" style="text-decoration: none; display: inline-flex; align-items: center;">Annuler</a>
                <button type="submit" class="btn-primary-kanban" style="width: auto; padding: 0 28px;">Créer le tableau</button>
            </div>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/javascript/kanban.js(v=${#dates.createNow().time})}"></script>
</body>
</html>
