<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban — Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/styles/common.css}" rel="stylesheet">
    <link th:href="@{/styles/auth.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card">

    <!-- Logo -->
    <div class="logo logo-lg">
        <span class="logo-k">K</span>anban
    </div>
    <div class="auth-subtitle">Gestion de projets collaborative</div>

    <!-- Onglets -->
    <div class="auth-tabs">
        <a th:href="@{/login}" class="auth-tab">Connexion</a>
        <a th:href="@{/register}" class="auth-tab active">Inscription</a>
    </div>

    <!-- Erreur globale -->
    <div th:if="${error}" class="alert-error">
        <span th:text="${error}">Une erreur est survenue.</span>
    </div>

    <!-- Formulaire -->
    <form id="registerForm" th:action="@{/register}" method="post" novalidate>

        <div class="mb-3">
            <label for="pseudo" class="form-label">Pseudo (unique)</label>
            <input type="text"
                   class="form-control"
                   th:classappend="${pseudoError} ? 'is-invalid'"
                   id="pseudo"
                   name="pseudo"
                   th:value="${pseudo}"
                   placeholder="Choisissez un pseudo"
                   required
                   autofocus>
            <div class="invalid-feedback" th:if="${pseudoError}" th:text="${pseudoError}">
                Ce champ est requis.
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   th:classappend="${emailError} ? 'is-invalid'"
                   id="email"
                   name="email"
                   th:value="${email}"
                   placeholder="votre@email.com"
                   required>
            <div class="invalid-feedback" th:if="${emailError}" th:text="${emailError}">
                Ce champ est requis.
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password"
                   class="form-control"
                   th:classappend="${passwordError} ? 'is-invalid'"
                   id="password"
                   name="password"
                   placeholder="••••••••"
                   required>
            <div class="invalid-feedback" th:if="${passwordError}" th:text="${passwordError}">
                Minimum 8 caractères.
            </div>
            <div th:unless="${passwordError}" class="field-hint">Minimum 8 caractères</div>
        </div>

        <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
            <input type="password"
                   class="form-control"
                   th:classappend="${confirmError} ? 'is-invalid'"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="••••••••"
                   required>
            <div class="invalid-feedback" th:if="${confirmError}" th:text="${confirmError}">
                Les mots de passe ne correspondent pas.
            </div>
        </div>

        <button type="submit" class="btn-primary-kanban mt-2">S'inscrire</button>

    </form>

    <div class="switch-text">
        Déjà un compte ? <a th:href="@{/login}">Se connecter</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/javascript/kanban.js}"></script>
</body>
</html>
