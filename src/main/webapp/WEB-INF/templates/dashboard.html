<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban — Mes tableaux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/styles/common.css}" rel="stylesheet">
    <link th:href="@{/styles/dashboard.css}" rel="stylesheet">
</head>
<body class="app-page">

<!-- Barre de navigation -->
<nav class="navbar-kanban">
    <a th:href="@{/dashboard}" class="logo logo-md" style="text-decoration: none;">
        <span class="logo-k">K</span>anban
    </a>

    <div class="navbar-right">
        <!-- Notifications -->
        <button class="bell" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="bell-dot"></span>
        </button>

        <!-- Utilisateur connecté -->
        <span class="avatar avatar-xl" style="background: var(--primary);"
              th:text="${userInitiales}">JD</span>
        <span class="navbar-username" th:text="${user}">jean.d</span>

        <!-- Déconnexion -->
        <a th:href="@{/logout}" class="navbar-logout">Déconnexion</a>
    </div>
</nav>

<!-- Contenu -->
<main class="page-container">

    <div class="page-header">
        <div>
            <h1 class="page-title">Mes tableaux</h1>
            <p class="page-subtitle">Retrouvez tous vos tableaux Kanban en un coup d'œil.</p>
        </div>
    </div>

    <div class="board-grid">

        <!-- Une carte par tableau -->
        <a th:each="tableau : ${tableaux}"
           th:href="@{/board(id=${tableau.id})}"
           class="board-card"
           style="text-decoration: none;">

            <div class="board-card-bar" th:style="'background: ' + ${tableau.couleur}"></div>

            <div class="board-card-name" th:text="${tableau.name}">Nom du tableau</div>

            <div class="board-card-meta">
                <span th:text="${tableau.nbTaches}">12</span> tâches ·
                <span th:text="${#lists.size(tableau.membres)}">3</span> membres
            </div>

            <div class="avatar-stack">
                <span th:each="membre : ${tableau.membres}"
                      class="avatar avatar-lg"
                      th:style="'background: ' + ${membre.couleur}"
                      th:text="${membre.initiales}">JD</span>
            </div>
        </a>

        <!-- Carte d'ajout d'un nouveau tableau -->
        <a th:href="@{/board/new}" class="add-card" style="text-decoration: none;">
            <span class="add-card-plus">+</span>
            <span class="add-card-label">Nouveau tableau</span>
        </a>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/javascript/kanban.js}"></script>
</body>
</html>
