<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban — Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/styles/common.css}" rel="stylesheet">
    <link th:href="@{/styles/auth.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-card">

    <!-- Logo -->
    <div class="logo logo-lg">
        <span class="logo-k">K</span>anban
    </div>
    <div class="auth-subtitle">Gestion de projets collaborative</div>

    <!-- Onglets -->
    <div class="auth-tabs">
        <a th:href="@{/login}" class="auth-tab active">Connexion</a>
        <a th:href="@{/register}" class="auth-tab">Inscription</a>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${error}" class="alert-error">
        <span th:text="${error}">Pseudo ou mot de passe incorrect.</span>
    </div>

    <!-- Message de succès (après inscription) -->
    <div th:if="${success}" class="alert-success">
        <span th:text="${success}">Inscription réussie !</span>
    </div>

    <!-- Formulaire -->
    <form id="loginForm" th:action="@{/login}" method="post" novalidate>

        <div class="mb-3">
            <label for="pseudo" class="form-label">Pseudo</label>
            <input type="text"
                   class="form-control"
                   th:classappend="${pseudoError} ? 'is-invalid'"
                   id="pseudo"
                   name="pseudo"
                   th:value="${pseudo}"
                   placeholder="Votre pseudo"
                   required
                   autofocus>
            <div class="invalid-feedback" th:if="${pseudoError}" th:text="${pseudoError}">
                Ce champ est requis.
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password"
                   class="form-control"
                   th:classappend="${passwordError} ? 'is-invalid'"
                   id="password"
                   name="password"
                   placeholder="••••••••"
                   required>
            <div class="invalid-feedback" th:if="${passwordError}" th:text="${passwordError}">
                Ce champ est requis.
            </div>
        </div>

        <button type="submit" class="btn-primary-kanban mt-2">Se connecter</button>

    </form>

    <div class="switch-text">
        Pas encore de compte ? <a th:href="@{/register}">S'inscrire</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/javascript/common.js}"></script>
<script th:src="@{/javascript/login.js}"></script>
</body>
</html>
